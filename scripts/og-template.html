<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Usuba social card</title>
    <link rel="stylesheet" href="og.css" />
    <style>
      .text { width: 690px; }
      h1 { margin: 34px 0 34px; font-size: 60px; line-height: 1.1; letter-spacing: -0.02em; }
      .mascot { position: absolute; right: 34px; top: 150px; width: 380px; }
      .s1 { right: 330px; top: 92px; transform: rotate(8deg); }
      .s2 { right: 52px; top: 70px; width: 30px; height: 30px; }
      .s3 { right: 120px; bottom: 96px; width: 34px; height: 34px; transform: rotate(-10deg); }
      .url { left: auto; right: 52px; top: 50px; bottom: auto; }
      .s2 { top: 110px; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="text">
          <p class="wordmark"><img src="../public/assets/brand/logo-mark.svg" alt="" />usuba</p>
          <h1>A local model trained on, and built for, Omarchy.</h1>
          <div class="pills">
            <span class="pill pill--mint">Checker Scripts v0.1.0</span>
            <span class="pill pill--butter">Checker Model v0.1.0</span>
            <span class="pill pill--steel">Out now</span>
          </div>
        </div>
        <img class="mascot" src="../public/assets/mascot/usu-chan-wave.svg" alt="" />
        <img class="sparkle s1" src="../public/assets/brand/sparkle.svg" alt="" />
        <img class="sparkle s2" src="../public/assets/brand/sparkle.svg" alt="" />
        <img class="sparkle s3" src="../public/assets/brand/sparkle.svg" alt="" />
        <p class="url">usuba.dev</p>
      </div>
    </div>
  </body>
</html>
