<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Usuba post social card</title>
    <link rel="stylesheet" href="og.css" />
    <style>
      .top { display: flex; align-items: center; justify-content: space-between; }
      .wordmark { font-size: 32px; }
      .wordmark img { width: 40px; height: 40px; }
      .meta { font-size: 22px; font-weight: 700; color: #5e3a52; }
      h1 { width: 760px; margin: 26px 0 30px; font-size: 66px; line-height: 1.06; letter-spacing: -0.02em; }
      .stats { display: flex; gap: 18px; }
      .stat { width: 268px; padding: 16px 20px; border: 3px solid #4a2a3f; border-radius: 22px; box-shadow: 5px 5px 0 #4a2a3f; }
      .stat:nth-child(1) { background: #bdeed8; transform: rotate(-1.5deg); }
      .stat:nth-child(2) { background: #ffe69a; transform: rotate(1deg); }
      .stat:nth-child(3) { background: #d9ccff; transform: rotate(-0.6deg); }
      .stat__value { display: block; font-size: 44px; line-height: 1.05; }
      .stat__text { display: block; margin-top: 4px; font-size: 18px; font-weight: 700; line-height: 1.3; }
      .mascot { position: absolute; right: 30px; top: 104px; width: 280px; }
      .s1 { right: 300px; top: 120px; width: 34px; height: 34px; transform: rotate(10deg); }
      .label { position: absolute; right: 52px; bottom: 36px; font-size: 18px; font-weight: 700; color: #5e3a52; }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="card">
        <div class="top">
          <p class="wordmark"><img src="../public/assets/brand/logo-mark.svg" alt="" />usuba</p>
          <p class="meta" data-k="meta"></p>
        </div>
        <h1 data-k="title"></h1>
        <div class="stats">
          <p class="stat"><span class="stat__value" data-k="s1v"></span><span class="stat__text" data-k="s1t"></span></p>
          <p class="stat"><span class="stat__value" data-k="s2v"></span><span class="stat__text" data-k="s2t"></span></p>
          <p class="stat"><span class="stat__value" data-k="s3v"></span><span class="stat__text" data-k="s3t"></span></p>
        </div>
        <img class="mascot" src="../public/assets/mascot/usu-chan-celebrate.svg" alt="" />
        <img class="sparkle s1" src="../public/assets/brand/sparkle.svg" alt="" />
        <p class="url" data-k="url"></p>
        <p class="label" data-k="label"></p>
      </div>
    </div>
  </body>
</html>
